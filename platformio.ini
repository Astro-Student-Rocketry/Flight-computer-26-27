; Flight-computer-26-27
; teensy41: flyprogramvaren. Bytt board hvis dere bruker noe annet.
; native:   kjører core-logikken og testene på PC-en (pio test -e native)

[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200

[env:native]
platform = native
build_src_filter = -<*>
lib_ignore = drivers
test_build_src = no
build_flags = -std=c++17
